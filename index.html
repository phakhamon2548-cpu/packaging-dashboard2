<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packaging Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 p-6 min-h-screen">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
        📦 รายการบรรจุภัณฑ์คงเหลือ (Packaging Dashboard)
      </h1>
      <button onclick="fetchData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow">
        🔄 รีเฟรชข้อมูล
      </button>
    </div>

    <!-- Tabs Switcher -->
    <div class="bg-white rounded-xl p-2 shadow-sm border border-slate-200 inline-flex gap-2">
      <button id="tab-box" onclick="switchTab('box')" class="px-6 py-2 rounded-lg font-medium text-sm transition bg-indigo-50 text-indigo-600 border border-indigo-200">
        📦 Box Stock
      </button>
      <button id="tab-partition" onclick="switchTab('partition')" class="px-6 py-2 rounded-lg font-medium text-sm text-slate-500 hover:bg-slate-50 transition">
        🧩 Partition Stock
      </button>
    </div>

    <!-- Container -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-12 text-slate-400">กำลังโหลดข้อมูล...</div>
    </div>

  </div>

  <script>
    // 🔴 ใส่ Web App URL ของคุณที่นี่
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwNQc-l9Y2PZSnJMY73pZFWqoYwHzT1V_Kq-ksB1I6ejy9_kxgtMO_wFKQ83cvIfq1SA/exec";

    let allData = [];
    let currentTab = 'partition';

    function renderCards(data) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">ไม่พบข้อมูล หรือกำลังดึงข้อมูล...</div>`;
        return;
      }

      data.forEach(item => {
        const isPositive = item.diff >= 0;
        const statusText = isPositive ? `Stock เกิน +${item.diff.toLocaleString()}` : `Stock ขาด ${item.diff.toLocaleString()}`;
        const badgeBg = isPositive ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200';
        const diffColor = isPositive ? 'text-emerald-600' : 'text-rose-600';

        const card = `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                ${item.code}
              </span>
              <span class="text-xs font-semibold border px-2.5 py-1 rounded-full ${badgeBg}">
                ${statusText}
              </span>
            </div>

            <h3 class="text-lg font-bold text-slate-800 mb-4">${item.supp}</h3>

            <div class="space-y-2 text-sm text-slate-600 border-t border-slate-100 pt-3">
              <div class="flex justify-between">
                <span>Forecast (AUG):</span>
                <span class="font-semibold text-slate-800">${item.forecast.toLocaleString()}</span>
              </div>
              <div class="flex justify-between">
                <span>Stock พร้อมใช้:</span>
                <span class="font-semibold text-slate-800">${item.stock.toLocaleString()}</span>
              </div>
              <div class="flex justify-between pt-1 border-t border-dashed border-slate-200">
                <span class="font-medium">Diff Stock:</span>
                <span class="font-bold ${diffColor}">${item.diff.toLocaleString()}</span>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    async function fetchData() {
      const container = document.getElementById('cards-container');
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 font-medium">⏳ กำลังเชื่อมต่อข้อมูลจาก Google Sheets...</div>`;

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        allData = await res.json();
        renderCards(allData);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 font-medium">❌ เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาตรวจสอบ URL หรือการบันทึก Deploy</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-box').className = tab === 'box' 
        ? "px-6 py-2 rounded-lg font-medium text-sm transition bg-indigo-50 text-indigo-600 border border-indigo-200" 
        : "px-6 py-2 rounded-lg font-medium text-sm text-slate-500 hover:bg-slate-50 transition";

      document.getElementById('tab-partition').className = tab === 'partition' 
        ? "px-6 py-2 rounded-lg font-medium text-sm transition bg-indigo-50 text-indigo-600 border border-indigo-200" 
        : "px-6 py-2 rounded-lg font-medium text-sm text-slate-500 hover:bg-slate-50 transition";
      
      renderCards(allData);
    }

    // โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
    fetchData();
  </script>
</body>
</html>
